<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Studio Twenty Six</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="site.css?v=39" />
<style>
.admin-page{min-height:100vh;padding:48px 24px;background:var(--ink);color:var(--pearl)}
.admin-wrap{max-width:1180px;margin:0 auto}.admin-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px}
.admin-head h1{margin:8px 0 0;font-size:clamp(36px,6vw,72px)}.admin-login,.admin-empty,.admin-table-wrap{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-card);padding:24px}.admin-login{max-width:520px}
.admin-login form{display:grid;gap:14px}.admin-login label{display:grid;gap:7px}.admin-login input{width:100%;padding:14px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface-2);color:var(--pearl);font:inherit}.admin-login .btn{margin-top:4px;justify-content:center}.admin-status{color:var(--muted);margin-top:12px}
.admin-table-wrap{overflow:auto;padding:0}.admin-table{width:100%;border-collapse:collapse;min-width:850px}.admin-table th,.admin-table td{padding:16px 18px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}.admin-table th{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--magenta-ink)}.admin-table td strong{display:block;color:var(--pearl)}.admin-table td small{display:block;color:var(--muted);margin-top:4px}.admin-total{font-family:var(--font-mono);color:var(--teal);font-size:13px}
@media (max-width:650px){.admin-page{padding:28px 16px}.admin-head{display:block}.admin-head .btn{margin-top:18px}}
</style>
</head>
<body>
<main class="admin-page"><div class="admin-wrap">
  <div class="admin-head"><div><span class="eyebrow-m">Private studio view</span><h1>Bookings.</h1><p class="section-note">Paid class signups, pulled from Stripe.</p></div><a class="btn btn-outline" href="index.html">Back to site</a></div>
  <section class="admin-login" id="login-panel"><h2>Admin access</h2><p class="section-note">Use the admin username and password saved in Vercel.</p><form id="login-form"><label><span>Username</span><input id="admin-user" autocomplete="username" required /></label><label><span>Password</span><input id="admin-password" type="password" autocomplete="current-password" required /></label><button class="btn btn-fill" type="submit">View bookings</button></form><p class="admin-status" id="login-status" role="status"></p></section>
  <section id="bookings-panel" hidden><div class="admin-head"><div><span class="eyebrow-m">Paid signups</span><h2 id="booking-count">Bookings</h2></div><button class="btn btn-outline" id="refresh" type="button">Refresh</button></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Class</th><th>Customer</th><th>Seats</th><th>Paid</th></tr></thead><tbody id="bookings"></tbody></table></div><div class="admin-empty" id="empty" hidden>No paid bookings yet.</div></section>
</div></main>
<script>
const form=document.getElementById("login-form"),status=document.getElementById("login-status"),loginPanel=document.getElementById("login-panel"),bookingsPanel=document.getElementById("bookings-panel"),tbody=document.getElementById("bookings"),empty=document.getElementById("empty");let auth="";
function textCell(value,tag="span"){const el=document.createElement(tag);el.textContent=value||"";return el}
function money(cents,currency){return new Intl.NumberFormat(undefined,{style:"currency",currency:(currency||"usd").toUpperCase()}).format((cents||0)/100)}
function date(iso){return iso?new Date(iso+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"}):"Date pending"}
function cell(primary,secondary){const td=document.createElement("td"),strong=textCell(primary,"strong"),small=textCell(secondary,"small");td.append(strong,small);return td}
async function loadBookings(){status.textContent="Loading bookings...";const response=await fetch("../api/admin-bookings",{headers:{Authorization:auth}}),data=await response.json();if(!response.ok)throw new Error(data.error||"Could not load bookings.");tbody.replaceChildren(...data.bookings.map((b)=>{const row=document.createElement("tr"),customer=cell(b.name||"Guest",b.email||"No email"),email=customer.querySelector("small");if(b.email){const link=document.createElement("a");link.href="mailto:"+b.email;link.textContent=b.email;email.replaceChildren(link)}row.append(cell(b.title||"Class",date(b.date)+" · "+(b.time||"")));row.append(customer);row.append(textCell(String(b.seats)));const paid=cell(money(b.amount,b.currency),new Date(b.created*1000).toLocaleString());paid.className="admin-total";row.append(paid);return row}));document.getElementById("booking-count").textContent=data.bookings.length+" "+(data.bookings.length===1?"booking":"bookings");empty.hidden=data.bookings.length>0;status.textContent="Updated just now."}
form.addEventListener("submit",async(event)=>{event.preventDefault();auth="Basic "+btoa(document.getElementById("admin-user").value+":"+document.getElementById("admin-password").value);try{await loadBookings();loginPanel.hidden=true;bookingsPanel.hidden=false}catch(error){status.textContent=error.message}});document.getElementById("refresh").addEventListener("click",()=>loadBookings().catch((error)=>{status.textContent=error.message}));
</script>
</body>
</html>
